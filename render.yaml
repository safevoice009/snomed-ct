# Render Infrastructure-as-Code Blueprint for SICCE Healthcare Gateway
services:
  - type: web
    name: sicce-clinical-gateway
    env: python
    region: singapore # Closest low-latency region to India
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
