name: SICCE Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Ingest & Run Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv package manager
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync

    - name: Build clinical knowledge index
      run: |
        uv run python scripts/load_rf2.py --seed-only

    - name: Execute Pytest Suite (40 Tests)
      run: |
        uv run pytest -v tests/
